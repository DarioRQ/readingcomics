name: ci

# Compila y pasa los tests en cada push a main y en cada PR. El workflow de
# release solo se dispara con un tag, asi que sin esto un fallo no se descubre
# hasta que ya se esta publicando una version.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: install Linux dependencies
        run: |
          sudo apt-get update
          # libsecret: lo necesita `keyring` para guardar el token de Metron
          # en el almacen de credenciales del sistema.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install

      # `pnpm build` incluye `tsc`, asi que tambien valida los tipos.
      - run: pnpm build

      - run: cargo test --manifest-path src-tauri/Cargo.toml
