name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libsecret: lo necesita `keyring` para guardar el token de Metron
          # en el almacén de credenciales del sistema.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsecret-1-dev

      - uses: dtolnay/rust-toolchain@stable

      # Sin esto cada release recompila Rust desde cero (~11 min en Windows).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'readingcomics ${{ github.ref_name }}'
          releaseBody: 'Ver los cambios en CHANGELOG.md.'
          # Publicado directamente, sin pasar por borrador: asi el release se
          # completa solo aunque no haya nadie delante. El precio es que un
          # build roto llega a los usuarios sin revision, asi que conviene que
          # `pnpm build` y `cargo test` esten en verde antes de crear el tag.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
